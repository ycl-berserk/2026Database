services:
  db:
    image: pgvector/pgvector:pg16
    container_name: learning-space-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learning_space
      TZ: Asia/Shanghai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_space"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
    container_name: learning-space-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ls_app:ls_app_dev_pw@db:5432/learning_space
      T2S_DATABASE_URL: postgresql://t2s_reader:t2s_dev_pw@db:5432/learning_space
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      TEST_DATABASE_URL: postgresql://ls_app:ls_app_dev_pw@db:5432/learning_space_test
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me-please-32-chars}
      APP_ENV: ${APP_ENV:-dev}
      INIT_DB: ${INIT_DB:-1}
      SEED_DEMO: ${SEED_DEMO:-1}
      TEXT2SQL_MODE: ${TEXT2SQL_MODE:-auto}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\""]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  pgdata:
