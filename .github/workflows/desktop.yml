name: Desktop packaging

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows NSIS
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Install packaging tools
        run: uv pip install -r packaging/requirements.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Cache PostgreSQL and pgvector build
        uses: actions/cache@v4
        with:
          path: |
            packaging/build/pgsql
            packaging/.cache
          key: pg16-${{ hashFiles('packaging/postgres/manifest.json', 'packaging/postgres/build_pgvector.py', 'packaging/postgres/fetch_trim.py', 'packaging/build.py') }}

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@^2

      - name: Build desktop resources
        run: uv run python packaging/build.py

      - name: Build NSIS installer
        working-directory: desktop
        run: tauri build --bundles nsis

      - name: Install and smoke test
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe |
            Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }

          $size = [math]::Round($installer.Length / 1MB, 1)
          "Installer: $($installer.Name) - $size MiB" | Add-Content $env:GITHUB_STEP_SUMMARY

          $installDir = "C:\ls-install"
          $process = Start-Process -FilePath $installer.FullName `
            -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "installer failed: $($process.ExitCode)"
          }

          $exe = Join-Path $installDir "learning-space-desktop.exe"
          if (-not (Test-Path $exe)) { throw "installed exe not found: $exe" }

          # initdb 在 D:\a 工作区上无法改目录 ACL（Permission denied），数据目录必须放 C:。
          $env:LS_HOME = "C:\ls-smoke-home"
          Remove-Item $env:LS_HOME -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $env:LS_HOME | Out-Null

          $smoke = Start-Process -FilePath $exe -ArgumentList "--smoke" `
            -Wait -PassThru -NoNewWindow
          Write-Host "smoke exit code: $($smoke.ExitCode)"
          Get-Content "$env:LS_HOME\smoke-report.json" -ErrorAction SilentlyContinue

          if ($smoke.ExitCode -ne 0) {
            Get-Content "$env:LS_HOME\logs\*.log" -Tail 120 -ErrorAction SilentlyContinue
            exit 1
          }

      # 一次性诊断：PostgreSQL 的 pgreadlink() 用 CP_ACP 转换 junction 目标，
      # 在非中文代码页系统上中文目标路径会退化成 "?"，导致 stat 报 ENOENT。
      # 这里验证 subst 盘符能否替代 junction 转发中文路径。
      - name: Diagnose non-ASCII path forwarding
        shell: pwsh
        run: |
          $acp = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Nls\CodePage').ACP
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString) / ACP=$acp / user=$(whoami)"

          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe |
            Select-Object -First 1
          $installDir = "C:\ls-parent\安装测试"
          Start-Process -FilePath $installer.FullName `
            -ArgumentList @("/S", "/D=$installDir") -Wait | Out-Null
          $cnPgDir = Join-Path $installDir "resources\pgsql"
          $cnPgBin = Join-Path $cnPgDir "bin"

          function Invoke-InitDb([string]$label, [string]$binDir, [string]$dataDir) {
            Write-Host "===== $label : $dataDir ====="
            Remove-Item $dataDir -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force $dataDir | Out-Null
            $out = & (Join-Path $binDir "initdb.exe") -D $dataDir -U postgres `
              -A trust --encoding=UTF8 --locale=C 2>&1
            Write-Host "exit=$LASTEXITCODE"
            $out | Select-Object -Last 5 | ForEach-Object { Write-Host "  $_" }
            Write-Host "files: $((Get-ChildItem $dataDir -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Name) -join ', ')"
          }

          # A: 中文安装路径（直接调用），真实 ASCII 数据目录 —— 验证 PG 自身路径是否可跑
          Invoke-InitDb "A chinese-bin ascii-data" $cnPgBin "C:\diag\data-a"

          # B: ASCII 安装路径 + junction 到 ASCII 目标 —— 对照组
          New-Item -ItemType Directory -Force "C:\diag\ascii-target" | Out-Null
          cmd /c mklink /J "C:\diag\link-ascii" "C:\diag\ascii-target" | Out-Null
          Invoke-InitDb "B ascii-bin junction-ascii" "C:\ls-install\resources\pgsql\bin" "C:\diag\link-ascii"

          # C: ASCII 安装路径 + junction 到中文目标 —— 复现 CI 失败
          New-Item -ItemType Directory -Force "C:\diag\中文目标" | Out-Null
          cmd /c mklink /J "C:\diag\link-中文" "C:\diag\中文目标" | Out-Null
          Invoke-InitDb "C ascii-bin junction-chinese" "C:\ls-install\resources\pgsql\bin" "C:\diag\link-中文"

          # D: ASCII 安装路径 + subst 盘符映射到中文目标
          New-Item -ItemType Directory -Force "C:\diag\中文目标2" | Out-Null
          cmd /c subst Z: C:\diag\中文目标2
          Write-Host "subst Z: -> $((cmd /c dir Z:\ 2>&1) -join ' | ')"
          Invoke-InitDb "D ascii-bin subst-chinese" "C:\ls-install\resources\pgsql\bin" "Z:\data-d"
          cmd /c subst Z: /D

          # E: subst 盘符映射到中文安装目录，PG 可执行文件本身也经盘符访问
          cmd /c subst Y: "$cnPgDir"
          Write-Host "subst Y: -> $((cmd /c dir Y:\ 2>&1) -join ' | ')"
          Invoke-InitDb "E subst-bin ascii-data" "Y:\bin" "C:\diag\data-e"
          cmd /c subst Y: /D

          Write-Host "== reparse points =="
          cmd /c dir C:\diag /AL

      - name: Smoke test with non-ASCII paths
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe |
            Select-Object -First 1
          $installDir = "C:\ls-parent\安装测试"
          $process = Start-Process -FilePath $installer.FullName `
            -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "installer failed: $($process.ExitCode)"
          }

          $exe = Join-Path $installDir "learning-space-desktop.exe"
          if (-not (Test-Path $exe)) { throw "installed exe not found: $exe" }

          $env:LS_HOME = "C:\ls-smoke-中文"
          Remove-Item $env:LS_HOME -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $env:LS_HOME | Out-Null

          $smoke = Start-Process -FilePath $exe -ArgumentList "--smoke" `
            -Wait -PassThru -NoNewWindow
          Write-Host "non-ASCII smoke exit code: $($smoke.ExitCode)"
          Get-Content "$env:LS_HOME\smoke-report.json" -ErrorAction SilentlyContinue

          if ($smoke.ExitCode -ne 0) {
            Get-Content "$env:LS_HOME\logs\*.log" -Tail 120 -ErrorAction SilentlyContinue
            exit 1
          }

      # upload-artifact 只接受工作区内的路径，而 LS_HOME 在 C: 盘，需先复制进来。
      - name: Collect smoke artifacts
        if: always()
        shell: pwsh
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE "smoke-artifacts"
          foreach ($lsHome in @("C:\ls-smoke-home", "C:\ls-smoke-中文")) {
            $dest = Join-Path $staging (Split-Path $lsHome -Leaf)
            New-Item -ItemType Directory -Force $dest | Out-Null
            Copy-Item "$lsHome\smoke-report.json" $dest -ErrorAction SilentlyContinue
            Copy-Item "$lsHome\logs\*.log" $dest -ErrorAction SilentlyContinue
          }

      - name: Show logs on failure
        if: failure()
        shell: pwsh
        run: |
          foreach ($lsHome in @("C:\ls-smoke-home", "C:\ls-smoke-中文")) {
            Get-ChildItem "$lsHome\logs" -ErrorAction SilentlyContinue |
              ForEach-Object { "== $($lsHome)\$($_.Name) =="; Get-Content $_.FullName -Tail 80 }
          }
          cmd /c dir C:\ProgramData\LearningSpace /AL
          Get-Content packaging/build/size-report.md -ErrorAction SilentlyContinue

      - name: Upload installer and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            packaging/build/size-report.json
            packaging/build/size-report.md
            smoke-artifacts/**
          if-no-files-found: warn

  macos:
    name: macOS arm64 DMG
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Install packaging tools
        run: uv pip install -r packaging/requirements.txt

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: macos-arm64

      - name: Cache PostgreSQL and pgvector build
        uses: actions/cache@v4
        with:
          path: |
            packaging/build/pgsql
            packaging/.cache
          key: macos-pg16-${{ hashFiles('packaging/postgres/manifest-macos.json', 'packaging/postgres/build_macos.sh', 'packaging/postgres/build_pgvector_macos.sh', 'packaging/build.py') }}

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@^2

      - name: Build desktop resources
        run: uv run python packaging/build.py

      - name: Build app bundle
        working-directory: desktop
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: tauri build --bundles app --target aarch64-apple-darwin

      - name: Ad-hoc sign app bundle
        run: |
          APP="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Learning Space.app"
          if [ ! -d "$APP" ]; then
            echo "app bundle not found: $APP" >&2
            exit 1
          fi
          PG_BIN="$(find "$APP" -type d -path "*/pgsql/bin" -print -quit)"
          SIDECAR="$(find "$APP" -type f -name "ls-server" -path "*/sidecar/*" -print -quit)"
          if [ -z "$PG_BIN" ] || [ -z "$SIDECAR" ]; then
            echo "bundled resources missing (pg=$PG_BIN sidecar=$SIDECAR)" >&2
            exit 1
          fi
          chmod +x "$PG_BIN"/*
          chmod +x "$SIDECAR"
          # Deep signing lets codesign treat Python.framework and the PG dylibs
          # as bundles; signing individual files inside a framework fails with
          # "bundle format is ambiguous".
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Smoke test
        env:
          LS_HOME: ${{ runner.temp }}/ls-smoke
        run: |
          APP="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Learning Space.app"
          ls -l "$APP/Contents/MacOS"
          BIN="$(find "$APP/Contents/MacOS" -type f -perm -111 -print -quit)"
          if [ -z "$BIN" ]; then
            echo "main binary not found" >&2
            exit 1
          fi
          mkdir -p "$LS_HOME"
          "$BIN" --smoke
          cat "$LS_HOME/smoke-report.json"

      - name: Build DMG
        run: |
          APP="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Learning Space.app"
          VERSION="$(uv run python -c 'import json,pathlib;print(json.loads(pathlib.Path("desktop/src-tauri/tauri.conf.json").read_text())["version"])')"
          DMG="Learning Space_${VERSION}_aarch64.dmg"
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Learning Space" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          hdiutil verify "$DMG"
          ls -lh "$DMG"
          SIZE="$(du -h "$DMG" | cut -f1)"
          echo "DMG: $DMG - $SIZE" >> "$GITHUB_STEP_SUMMARY"
          cat packaging/build/size-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Show logs on failure
        if: failure()
        run: |
          for log in "$RUNNER_TEMP"/ls-smoke/logs/*.log; do
            [ -f "$log" ] || continue
            echo "== $log =="
            tail -n 120 "$log"
          done
          cat packaging/build/size-report.md 2>/dev/null || true

      - name: Upload DMG and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            Learning Space_*_aarch64.dmg
            packaging/build/size-report.json
            packaging/build/size-report.md
            ${{ runner.temp }}/ls-smoke/smoke-report.json
            ${{ runner.temp }}/ls-smoke/logs/*.log
          if-no-files-found: warn
