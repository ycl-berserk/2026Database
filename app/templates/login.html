<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>登录 · {{ app_name }}</title>
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
</head>
<body class="login-page">
  {% include "partials/desktop_frame.html" %}
  <main class="login-shell">
    <section class="login-card card" aria-labelledby="login-title">
      <div class="auth-head">
        <span class="brand-mark">学</span>
        <span class="auth-brand-text">
          <strong>{{ app_name }}</strong>
          <small>问答记录 · 课程资料 · 复习队列</small>
        </span>
      </div>
      <h1 id="login-title">登录</h1>
      <p class="muted">{% if demo_mode %}使用课程演示账号进入系统。{% else %}使用本机账号登录。{% endif %}</p>
      {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
      <form method="post" action="/login" class="stack" id="login-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next_url }}">
        <label class="field">
          <span>用户名</span>
          <input name="username" id="login-username" value="{{ username or '' }}" autocomplete="username" required autofocus>
        </label>
        <label class="field">
          <span>密码</span>
          <input name="password" id="login-password" type="password" autocomplete="current-password" required>
        </label>
        <button class="btn btn-primary btn-block" type="submit">登录</button>
      </form>

      {% if demo_mode %}
      <div class="demo-accounts">
        <span class="eyebrow">演示账号 · 点一下直接进入</span>
        <button class="demo-row demo-login" type="button" data-demo-login data-username="alice" data-password="Alice123!">
          <code>alice</code><span>学生 · 5 门课所有者</span><small>完整体验</small>
        </button>
        <button class="demo-row demo-login" type="button" data-demo-login data-username="bob" data-password="Bob123!">
          <code>bob</code><span>共享成员 · editor / viewer</span><small>权限对照</small>
        </button>
        <button class="demo-row demo-login" type="button" data-demo-login data-username="admin" data-password="Admin123!">
          <code>admin</code><span>管理员 · 仅聚合数据</span><small>管理视图</small>
        </button>
      </div>
      {% endif %}
    </section>
    <p class="login-foot muted">本地部署 · 演示数据不含真实个人信息</p>
  </main>
  <script src="/static/app.js?v={{ asset_version }}"></script>
</body>
</html>
