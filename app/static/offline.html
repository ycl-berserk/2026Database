<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#232b25">
  <title>离线 · 学习空间</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f6f2e9;
      color: #232823;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      line-height: 1.6;
    }
    .card {
      width: min(420px, 100%);
      padding: 28px 24px;
      border: 1px solid #d9d1be;
      border-radius: 12px;
      background: #fffdf7;
      box-shadow: 0 8px 24px rgba(35, 40, 35, .08);
      text-align: center;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      border-radius: 12px;
      background: #a8432c;
      color: #fff5ec;
      font-size: 23px;
      font-weight: 700;
    }
    h1 { margin: 0 0 6px; font-size: 20px; }
    p { margin: 0 0 18px; color: #4a5149; font-size: 14px; }
    button {
      width: 100%;
      min-height: 44px;
      border: 1px solid #2f5d4e;
      border-radius: 8px;
      background: #2f5d4e;
      color: #f6f2e9;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    small { display: block; margin-top: 14px; color: #7a8076; font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">学</div>
    <h1>当前处于离线状态</h1>
    <p>网络恢复后刷新即可继续。已打开的页面如果未缓存，将无法离线访问。</p>
    <button type="button" onclick="location.reload()">重新加载</button>
    <small>学习空间 · 演示数据不含真实个人信息</small>
  </main>
</body>
</html>
