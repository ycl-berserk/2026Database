<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#232b25">
  <title>离线学习 · 学习空间</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f2e9;
      --white: #fffdf7;
      --ink: #232823;
      --ink-2: #4a5149;
      --ink-3: #7a8076;
      --line: #e2dac8;
      --jade: #2f5d4e;
      --seal: #a8432c;
      --amber: #a6771f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--jade); }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 253, 247, .94);
      position: sticky;
      top: 0;
      backdrop-filter: blur(8px);
      z-index: 5;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: var(--seal);
      color: #fff5ec;
      font-size: 21px;
      font-weight: 700;
    }
    h1 { margin: 0; font-size: 19px; }
    .status { margin: 1px 0 0; color: var(--ink-3); font-size: 12.5px; }
    .status.offline { color: var(--amber); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      color: var(--ink);
      font: inherit;
      font-size: 13.5px;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { border-color: var(--jade); text-decoration: none; }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn-sm { min-height: 34px; padding: 5px 11px; font-size: 13px; }
    .btn-primary { background: var(--jade); border-color: var(--jade); color: #f7fbf7; }
    .btn-danger { color: var(--seal); border-color: #d9b3a6; background: transparent; }
    main { width: min(860px, 100%); margin: 0 auto; padding: 22px 18px 60px; }
    h2 { margin: 0; font-size: 17px; }
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--white);
      width: fit-content;
    }
    .tab {
      padding: 7px 15px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--ink-2);
      font: inherit;
      font-size: 13.5px;
      cursor: pointer;
    }
    .tab.active { background: var(--jade); color: #f7fbf7; }
    .toolbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .muted { color: var(--ink-3); font-size: 13px; }
    .list { display: flex; flex-direction: column; gap: 10px; }
    .item {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--white);
      color: inherit;
      text-align: left;
      font: inherit;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(35, 40, 35, .04);
    }
    .item:hover { border-color: var(--jade); }
    .item strong { display: block; font-size: 15px; margin-bottom: 3px; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; color: var(--ink-3); font-size: 12.5px; }
    .chip {
      display: inline-block;
      padding: 1px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fbf8f0;
      color: var(--ink-2);
      font-size: 12px;
    }
    .badge {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 999px;
      background: #f1ece0;
      color: var(--ink-2);
      font-size: 12px;
    }
    .badge-warn { background: #f6e7cf; color: #8a5b12; }
    .empty {
      padding: 38px 18px;
      border: 1px dashed var(--line);
      border-radius: 10px;
      background: var(--white);
      text-align: center;
      color: var(--ink-2);
    }
    .empty p { margin: 0 0 6px; }
    .actions { display: flex; justify-content: flex-end; margin-top: 18px; }
    .reader-back { margin-bottom: 12px; }
    .reader-head { margin-bottom: 14px; }
    .reader-head h2 { margin-bottom: 4px; }
    .msg {
      margin-bottom: 12px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--white);
    }
    .msg.user { border-left: 3px solid var(--jade); }
    .msg.assistant { border-left: 3px solid var(--amber); }
    .msg-head { display: flex; flex-wrap: wrap; gap: 8px; color: var(--ink-3); font-size: 12px; margin-bottom: 5px; }
    .msg-role { color: var(--ink-2); font-weight: 600; }
    .msg-body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
    .note {
      margin-top: 9px;
      padding: 8px 10px;
      border-left: 2px solid var(--seal);
      background: #fbf4ee;
      font-size: 12.5px;
      color: var(--ink-2);
      white-space: pre-wrap;
    }
    .note b { color: var(--seal); margin-right: 6px; }
    .review-card {
      padding: 15px 17px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--white);
    }
    .review-card + .review-card { margin-top: 10px; }
    .review-card.is-pending { opacity: .82; }
    .review-head { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-bottom: 8px; font-size: 12.5px; }
    .review-body { margin-bottom: 9px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .quote {
      margin: 0 0 11px;
      padding: 9px 12px;
      border-left: 2px solid var(--line);
      background: #faf7ef;
      color: var(--ink-2);
      font-size: 13px;
      white-space: pre-wrap;
    }
    .review-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .sync-note {
      margin: 14px 0 0;
      padding: 9px 12px;
      border: 1px solid #e4d3b4;
      border-radius: 8px;
      background: #fbf3e4;
      color: #7a5312;
      font-size: 12.5px;
    }
    .sync-note[hidden] { display: none; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 16px);
      max-width: calc(100% - 32px);
      padding: 9px 16px;
      border-radius: 999px;
      background: #232b25;
      color: #f8f4e8;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 20;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 520px) {
      .top { padding: 14px 16px; }
      main { padding: 18px 14px 48px; }
      .brand .mark { width: 38px; height: 38px; }
      .tabs { width: 100%; }
      .tab { flex: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark">学</span>
      <div>
        <h1>离线学习</h1>
        <p class="status" id="status">正在检查网络状态…</p>
      </div>
    </div>
    <a class="btn" href="/dashboard">返回学习空间</a>
  </header>

  <main>
    <div class="tabs" role="tablist" aria-label="离线内容">
      <button class="tab active" id="tab-conversations" type="button" role="tab" aria-selected="true">
        已保存会话 <span id="conv-count"></span>
      </button>
      <button class="tab" id="tab-reviews" type="button" role="tab" aria-selected="false">
        离线复习 <span id="review-count"></span>
      </button>
    </div>

    <section id="list-view">
      <div class="toolbar">
        <h2>已保存的会话</h2>
        <span class="muted" id="count">读取中…</span>
      </div>
      <div class="list" id="list"></div>
      <div class="empty" id="empty" hidden>
        <p>还没有保存离线内容。</p>
        <p class="muted">联网时打开一个会话，点「保存到离线」即可在这里阅读。</p>
      </div>
      <p class="sync-note" id="sync-note" hidden></p>
      <div class="actions">
        <button class="btn btn-danger" id="clear" type="button" hidden>清除本机离线数据</button>
      </div>
    </section>

    <section id="review-view" hidden>
      <div class="toolbar">
        <h2>今日复习</h2>
        <span class="muted" id="queue-time">读取中…</span>
      </div>
      <div id="review-list"></div>
      <div class="empty" id="review-empty" hidden>
        <p>本机还没有复习队列缓存。</p>
        <p class="muted">联网时打开「复习队列」页，队列会自动缓存到这里。</p>
      </div>
    </section>

    <section id="reader" hidden>
      <div class="reader-back">
        <button class="btn" id="back" type="button">← 返回列表</button>
      </div>
      <header class="reader-head">
        <h2 id="reader-title"></h2>
        <p class="muted" id="reader-meta"></p>
      </header>
      <div id="messages"></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      "use strict";
      var DB_NAME = "ls-offline";
      var DB_VERSION = 2;
      var STORES = ["conversations", "drafts", "outbox", "queue"];
      var dbPromise = null;
      var records = [];
      var queue = null;
      var drafts = [];
      var outbox = [];
      var roleLabels = { user: "我", assistant: "助手", system: "系统" };
      var kindLabels = { note: "笔记", question: "疑问", correction: "纠错", summary: "总结" };

      function openDb() {
        if (!dbPromise) {
          dbPromise = new Promise(function (resolve, reject) {
            var req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = function () {
              var db = req.result;
              STORES.forEach(function (name) {
                if (!db.objectStoreNames.contains(name)) {
                  db.createObjectStore(name, { keyPath: "id" });
                }
              });
            };
            req.onsuccess = function () { resolve(req.result); };
            req.onerror = function () { reject(req.error); };
          });
        }
        return dbPromise;
      }

      function requestResult(req) {
        return new Promise(function (resolve, reject) {
          req.onsuccess = function () { resolve(req.result); };
          req.onerror = function () { reject(req.error); };
        });
      }

      function getAll(store) {
        return openDb().then(function (db) {
          return requestResult(db.transaction(store, "readonly").objectStore(store).getAll());
        }).then(function (rows) { return rows || []; });
      }

      function put(store, value) {
        return openDb().then(function (db) {
          return new Promise(function (resolve, reject) {
            var tx = db.transaction(store, "readwrite");
            tx.objectStore(store).put(value);
            tx.oncomplete = function () { resolve(value); };
            tx.onerror = function () { reject(tx.error); };
          });
        });
      }

      function del(store, key) {
        return openDb().then(function (db) {
          return new Promise(function (resolve, reject) {
            var tx = db.transaction(store, "readwrite");
            tx.objectStore(store).delete(key);
            tx.oncomplete = resolve;
            tx.onerror = function () { reject(tx.error); };
          });
        });
      }

      function clearAll() {
        return openDb().then(function (db) {
          return new Promise(function (resolve, reject) {
            var tx = db.transaction(STORES, "readwrite");
            STORES.forEach(function (name) { tx.objectStore(name).clear(); });
            tx.oncomplete = resolve;
            tx.onerror = function () { reject(tx.error); };
          });
        });
      }

      function newEventId() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }
        return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (ch) {
          var r = (Math.random() * 16) | 0;
          var v = ch === "x" ? r : (r & 0x3) | 0x8;
          return v.toString(16);
        });
      }

      function formatDate(value) {
        if (!value) return "—";
        var date = new Date(value);
        if (isNaN(date.getTime())) return String(value);
        return date.toLocaleString("zh-CN", {
          month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"
        });
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

      function toast(message) {
        var node = document.getElementById("toast");
        node.textContent = message;
        node.classList.add("show");
        clearTimeout(node._timer);
        node._timer = setTimeout(function () { node.classList.remove("show"); }, 2800);
      }

      function updateStatus() {
        var status = document.getElementById("status");
        var online = navigator.onLine;
        var pending = drafts.length + outbox.length;
        status.textContent = online
          ? "网络已连接 · 离线资料只保存在本设备"
          : "当前离线 · 只显示已保存内容";
        if (pending) status.textContent += " · " + pending + " 项待同步";
        status.classList.toggle("offline", !online);
        updateSyncNote();
      }

      function updateSyncNote() {
        var note = document.getElementById("sync-note");
        var pending = drafts.length + outbox.length;
        note.hidden = !pending;
        if (pending) {
          note.textContent = "有 " + pending + " 项离线操作待同步" +
            (navigator.onLine ? "，正在自动提交…" : "，联网后会自动提交。");
        }
      }

      function showTab(name) {
        var conversations = name === "conversations";
        document.getElementById("list-view").hidden = !conversations;
        document.getElementById("review-view").hidden = conversations;
        document.getElementById("reader").hidden = true;
        document.getElementById("tab-conversations").classList.toggle("active", conversations);
        document.getElementById("tab-conversations").setAttribute("aria-selected", String(conversations));
        document.getElementById("tab-reviews").classList.toggle("active", !conversations);
        document.getElementById("tab-reviews").setAttribute("aria-selected", String(!conversations));
        window.scrollTo(0, 0);
      }

      function renderList() {
        var list = document.getElementById("list");
        var empty = document.getElementById("empty");
        var clear = document.getElementById("clear");
        var count = document.getElementById("count");
        list.textContent = "";
        records.sort(function (a, b) {
          return String(b.saved_at || "").localeCompare(String(a.saved_at || ""));
        });
        records.forEach(function (record) {
          var data = record.data || {};
          var conv = data.conversation || {};
          var item = el("button", "item");
          item.type = "button";
          item.appendChild(el("strong", null, conv.title || "未命名会话"));
          var meta = el("div", "meta");
          if (conv.course_code) meta.appendChild(el("span", "chip", conv.course_code));
          var counts = data.counts || {};
          meta.appendChild(el("span", null, (counts.total || 0) + " 条消息"));
          meta.appendChild(el("span", null, "保存于 " + formatDate(record.saved_at)));
          item.appendChild(meta);
          item.addEventListener("click", function () { renderReader(record); });
          list.appendChild(item);
        });
        empty.hidden = records.length > 0;
        clear.hidden = records.length === 0 && !drafts.length && !outbox.length && !queue;
        count.textContent = records.length ? "共 " + records.length + " 个会话" : "暂无内容";
        document.getElementById("conv-count").textContent = records.length ? "(" + records.length + ")" : "";
      }

      function renderReader(record) {
        var data = record.data || {};
        var conv = data.conversation || {};
        document.getElementById("list-view").hidden = true;
        document.getElementById("review-view").hidden = true;
        document.getElementById("reader").hidden = false;
        document.getElementById("reader-title").textContent = conv.title || "未命名会话";
        var meta = [];
        if (conv.course_code) meta.push(conv.course_code + " · " + (conv.course_name || ""));
        if (conv.platform) meta.push(conv.platform);
        meta.push(((data.counts || {}).total || 0) + " 条消息");
        document.getElementById("reader-meta").textContent = meta.join(" · ");

        var box = document.getElementById("messages");
        box.textContent = "";
        (data.messages || []).forEach(function (message) {
          var article = el("article", "msg " + (message.sender || "system"));
          var head = el("header", "msg-head");
          head.appendChild(el("span", "msg-role", roleLabels[message.sender] || message.sender || "消息"));
          head.appendChild(el("span", null, "#" + message.seq_no));
          if (message.created_at) head.appendChild(el("span", null, formatDate(message.created_at)));
          article.appendChild(head);
          article.appendChild(el("div", "msg-body", message.content || ""));
          (message.annotations || []).forEach(function (note) {
            var noteNode = el("div", "note");
            noteNode.appendChild(el("b", null, kindLabels[note.kind] || note.kind || "批注"));
            noteNode.appendChild(document.createTextNode(note.content || ""));
            article.appendChild(noteNode);
          });
          box.appendChild(article);
        });
        window.scrollTo(0, 0);
      }

      function pendingFor(reviewId) {
        for (var i = 0; i < outbox.length; i += 1) {
          if (Number(outbox[i].review_id) === Number(reviewId)) return outbox[i];
        }
        return null;
      }

      function renderReviews() {
        var box = document.getElementById("review-list");
        var empty = document.getElementById("review-empty");
        var items = queue && queue.items ? queue.items : [];
        box.textContent = "";
        document.getElementById("review-count").textContent = items.length ? "(" + items.length + ")" : "";
        document.getElementById("queue-time").textContent = queue && queue.generated_at
          ? "缓存于 " + formatDate(queue.generated_at)
          : "未缓存";
        empty.hidden = items.length > 0;

        items.forEach(function (item) {
          var pending = pendingFor(item.id);
          var card = el("article", "review-card" + (pending ? " is-pending" : ""));
          var head = el("div", "review-head");
          head.appendChild(el("span", "chip", kindLabels[item.kind] || item.kind || "批注"));
          if (item.course_code) head.appendChild(el("span", "chip", item.course_code));
          if (item.due_date) head.appendChild(el("span", "badge badge-warn", "截止 " + item.due_date));
          head.appendChild(el("span", "muted", "间隔 " + item.interval_days + " 天 · 已复习 " + item.review_count + " 次"));
          if (pending) {
            head.appendChild(el("span", "badge badge-warn", "待同步"));
          }
          card.appendChild(head);
          card.appendChild(el("div", "review-body", item.annotation_content || ""));
          var quote = el("blockquote", "quote");
          quote.textContent = item.snippet || "";
          card.appendChild(quote);

          var foot = el("div", "review-foot");
          if (!pending) {
            var done = el("button", "btn btn-primary btn-sm", "复习一次");
            done.type = "button";
            done.addEventListener("click", function () { queueAction(item, "done"); });
            foot.appendChild(done);
            var mastered = el("button", "btn btn-sm", "标记掌握");
            mastered.type = "button";
            mastered.addEventListener("click", function () { queueAction(item, "mastered"); });
            foot.appendChild(mastered);
          } else {
            foot.appendChild(el("span", "muted", "联网后自动同步，无需重复提交"));
          }
          card.appendChild(foot);
          box.appendChild(card);
        });
      }

      function saveQueue() {
        if (!queue) return Promise.resolve();
        return put("queue", queue);
      }

      function applyLocalAction(item, action) {
        if (!queue || !queue.items) return;
        if (action === "mastered") {
          queue.items = queue.items.filter(function (row) { return row.id !== item.id; });
        }
        // 复习打卡只标记待同步；具体间隔以服务端 FSRS 调度结果为准。
      }

      function queueAction(item, action, rating) {
        var record = {
          id: newEventId(),
          review_id: item.id,
          action: action,
          rating: rating || "good",
          scope: "active",
          csrf_token: (queue && queue.csrf_token) || "",
          created_at: new Date().toISOString()
        };
        outbox.push(record);
        applyLocalAction(item, action);
        Promise.all([put("outbox", record), saveQueue()]).then(function () {
          renderReviews();
          updateStatus();
          toast("已离线打卡，联网后自动提交");
          flushOutbox(true);
        }).catch(function () {
          toast("离线打卡暂存失败，请检查浏览器存储权限");
        });
      }

      function postJson(url, body, token) {
        return fetch(url, {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json",
            "X-CSRF-Token": token || ""
          },
          body: JSON.stringify(body)
        }).then(function (res) {
          if (!res.ok) {
            var err = new Error("HTTP " + res.status);
            err.status = res.status;
            throw err;
          }
          return res.json().catch(function () { return null; });
        });
      }

      async function flushDrafts() {
        var sent = 0;
        for (var i = 0; i < drafts.length; i += 1) {
          var draft = drafts[i];
          try {
            await postJson("/api/annotations", {
              message_id: draft.message_id,
              kind: draft.kind,
              content: draft.content,
              event_id: draft.id
            }, draft.csrf_token);
            sent += 1;
            drafts.splice(i, 1);
            i -= 1;
            await del("drafts", draft.id);
          } catch (err) {
            if (err.status >= 400 && err.status < 500) {
              drafts.splice(i, 1);
              i -= 1;
              await del("drafts", draft.id);
            } else {
              break;
            }
          }
        }
        return sent;
      }

      async function flushOutbox(silent) {
        if (!navigator.onLine) return 0;
        var sent = 0;
        for (var i = 0; i < outbox.length; i += 1) {
          var action = outbox[i];
          try {
            await postJson("/api/reviews/" + action.review_id + "/" + action.action, {
              event_id: action.id,
              rating: action.rating || "good"
            }, action.csrf_token || (queue && queue.csrf_token));
            sent += 1;
            outbox.splice(i, 1);
            i -= 1;
            await del("outbox", action.id);
          } catch (err) {
            if (err.status >= 400 && err.status < 500) {
              outbox.splice(i, 1);
              i -= 1;
              await del("outbox", action.id);
            } else {
              break;
            }
          }
        }
        if (sent) {
          renderReviews();
          updateStatus();
          if (!silent) toast("已同步 " + sent + " 项离线操作");
          refreshQueue();
        }
        return sent;
      }

      function refreshQueue() {
        if (!navigator.onLine) return Promise.resolve();
        return fetch("/api/reviews/offline", {
          credentials: "same-origin",
          headers: { "Accept": "application/json" }
        }).then(function (res) {
          if (!res.ok) return null;
          return res.json();
        }).then(function (data) {
          if (!data) return;
          queue = {
            id: "active",
            generated_at: data.generated_at,
            csrf_token: data.csrf_token,
            items: data.items || []
          };
          return saveQueue().then(function () {
            renderReviews();
            document.getElementById("queue-time").textContent =
              "缓存于 " + formatDate(queue.generated_at);
          });
        }).catch(function () {});
      }

      function loadAll() {
        return Promise.all([
          getAll("conversations"),
          getAll("drafts"),
          getAll("outbox"),
          getAll("queue")
        ]).then(function (rows) {
          records = rows[0] || [];
          drafts = rows[1] || [];
          outbox = rows[2] || [];
          queue = (rows[3] || [])[0] || null;
          renderList();
          renderReviews();
          updateStatus();
          if (navigator.onLine) {
            flushDrafts().then(function () { return flushOutbox(true); }).then(refreshQueue);
          }
        }).catch(function () {
          document.getElementById("count").textContent = "离线存储不可用";
          document.getElementById("empty").hidden = false;
        });
      }

      document.getElementById("tab-conversations").addEventListener("click", function () { showTab("conversations"); });
      document.getElementById("tab-reviews").addEventListener("click", function () { showTab("reviews"); });
      document.getElementById("back").addEventListener("click", function () { showTab("conversations"); });
      document.getElementById("clear").addEventListener("click", function () {
        if (!window.confirm("清除后本机将不再保留离线会话和待同步操作，确定继续？")) return;
        clearAll().then(function () {
          records = [];
          drafts = [];
          outbox = [];
          queue = null;
          renderList();
          renderReviews();
          updateStatus();
          toast("已清除本机离线数据");
        }).catch(function () {
          toast("清除失败，请稍后重试");
        });
      });

      window.addEventListener("online", function () {
        updateStatus();
        flushDrafts().then(function () { return flushOutbox(false); }).then(refreshQueue);
      });
      window.addEventListener("offline", updateStatus);
      updateStatus();
      loadAll();
    })();
  </script>
</body>
</html>
