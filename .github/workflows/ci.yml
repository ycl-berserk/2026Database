name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests and verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ls_app:ls_app_dev_pw@127.0.0.1:5432/learning_space
      T2S_DATABASE_URL: postgresql://t2s_reader:t2s_dev_pw@127.0.0.1:5432/learning_space
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgresql://ls_app:ls_app_dev_pw@127.0.0.1:5432/learning_space_test
      SESSION_SECRET: ci-only-session-secret-not-for-production
      APP_ENV: dev
      TEXT2SQL_MODE: mock
      EMBEDDING_MODE: "off"
      SUGGEST_MODE: "off"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Initialize demo and test databases
        run: python scripts/init_db.py --reset

      - name: Seed demo data
        run: python scripts/seed_demo.py

      - name: Run unit and integration tests
        run: python -m pytest -q --junitxml=data/verification/junit.xml

      - name: Run end-to-end verification
        run: python scripts/verify.py --json data/verification/report.json

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: |
            data/verification/report.json
            data/verification/junit.xml
          if-no-files-found: warn
