name: Desktop packaging

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows NSIS
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Install packaging tools
        run: uv pip install -r packaging/requirements.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Cache PostgreSQL and pgvector build
        uses: actions/cache@v4
        with:
          path: |
            packaging/build/pgsql
            packaging/.cache
          key: pg16-${{ hashFiles('packaging/postgres/manifest.json', 'packaging/postgres/build_pgvector.py', 'packaging/postgres/fetch_trim.py', 'packaging/build.py') }}

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@^2

      - name: Build desktop resources
        run: uv run python packaging/build.py

      - name: Build NSIS installer
        working-directory: desktop
        run: tauri build --bundles nsis

      - name: Install and smoke test
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe |
            Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }

          $size = [math]::Round($installer.Length / 1MB, 1)
          "Installer: $($installer.Name) - $size MiB" | Add-Content $env:GITHUB_STEP_SUMMARY

          $installDir = "C:\ls-install"
          $process = Start-Process -FilePath $installer.FullName `
            -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "installer failed: $($process.ExitCode)"
          }

          $exe = Join-Path $installDir "learning-space-desktop.exe"
          if (-not (Test-Path $exe)) { throw "installed exe not found: $exe" }

          $env:LS_HOME = "C:\ls-smoke-home"
          New-Item -ItemType Directory -Force $env:LS_HOME | Out-Null

          $smoke = Start-Process -FilePath $exe -ArgumentList "--smoke" `
            -Wait -PassThru -NoNewWindow
          Write-Host "smoke exit code: $($smoke.ExitCode)"
          Get-Content "$env:LS_HOME\smoke-report.json" -ErrorAction SilentlyContinue

          if ($smoke.ExitCode -ne 0) {
            Get-Content "$env:LS_HOME\logs\*.log" -Tail 120 -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Smoke test with non-ASCII paths
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe |
            Select-Object -First 1
          $installDir = "C:\ls-parent\安装测试"
          $process = Start-Process -FilePath $installer.FullName `
            -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "installer failed: $($process.ExitCode)"
          }

          $exe = Join-Path $installDir "learning-space-desktop.exe"
          if (-not (Test-Path $exe)) { throw "installed exe not found: $exe" }

          $env:LS_HOME = "C:\ls-smoke-中文"
          New-Item -ItemType Directory -Force $env:LS_HOME | Out-Null

          $smoke = Start-Process -FilePath $exe -ArgumentList "--smoke" `
            -Wait -PassThru -NoNewWindow
          Write-Host "non-ASCII smoke exit code: $($smoke.ExitCode)"
          Get-Content "$env:LS_HOME\smoke-report.json" -ErrorAction SilentlyContinue

          if ($smoke.ExitCode -ne 0) {
            Get-Content "$env:LS_HOME\logs\*.log" -Tail 120 -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Show logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "C:\ls-smoke-home\logs" -ErrorAction SilentlyContinue |
            ForEach-Object { "== $($_.Name) =="; Get-Content $_.FullName -Tail 80 }
          Get-Content packaging/build/size-report.md -ErrorAction SilentlyContinue

      - name: Upload installer and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            packaging/build/size-report.json
            packaging/build/size-report.md
            C:\ls-smoke-home\smoke-report.json
            C:\ls-smoke-home\logs\*.log
          if-no-files-found: warn

  macos:
    name: macOS arm64 DMG
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Install packaging tools
        run: uv pip install -r packaging/requirements.txt

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: macos-arm64

      - name: Cache PostgreSQL and pgvector build
        uses: actions/cache@v4
        with:
          path: |
            packaging/build/pgsql
            packaging/.cache
          key: macos-pg16-${{ hashFiles('packaging/postgres/manifest-macos.json', 'packaging/postgres/build_macos.sh', 'packaging/postgres/build_pgvector_macos.sh', 'packaging/build.py') }}

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@^2

      - name: Build desktop resources
        run: uv run python packaging/build.py

      - name: Build app bundle
        working-directory: desktop
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: tauri build --bundles app --target aarch64-apple-darwin

      - name: Ad-hoc sign app bundle
        run: |
          APP="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Learning Space.app"
          if [ ! -d "$APP" ]; then
            echo "app bundle not found: $APP" >&2
            exit 1
          fi
          PG_BIN="$(find "$APP" -type d -path "*/pgsql/bin" -print -quit)"
          SIDECAR="$(find "$APP" -type f -name "ls-server" -path "*/sidecar/*" -print -quit)"
          if [ -z "$PG_BIN" ] || [ -z "$SIDECAR" ]; then
            echo "bundled resources missing (pg=$PG_BIN sidecar=$SIDECAR)" >&2
            exit 1
          fi
          chmod +x "$PG_BIN"/*
          chmod +x "$SIDECAR"
          # Deep signing lets codesign treat Python.framework and the PG dylibs
          # as bundles; signing individual files inside a framework fails with
          # "bundle format is ambiguous".
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Smoke test
        env:
          LS_HOME: ${{ runner.temp }}/ls-smoke
        run: |
          APP="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Learning Space.app"
          ls -l "$APP/Contents/MacOS"
          BIN="$(find "$APP/Contents/MacOS" -type f -perm -111 -print -quit)"
          if [ -z "$BIN" ]; then
            echo "main binary not found" >&2
            exit 1
          fi
          mkdir -p "$LS_HOME"
          "$BIN" --smoke
          cat "$LS_HOME/smoke-report.json"

      - name: Build DMG
        run: |
          APP="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Learning Space.app"
          VERSION="$(uv run python -c 'import json,pathlib;print(json.loads(pathlib.Path("desktop/src-tauri/tauri.conf.json").read_text())["version"])')"
          DMG="Learning Space_${VERSION}_aarch64.dmg"
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Learning Space" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          hdiutil verify "$DMG"
          ls -lh "$DMG"
          SIZE="$(du -h "$DMG" | cut -f1)"
          echo "DMG: $DMG - $SIZE" >> "$GITHUB_STEP_SUMMARY"
          cat packaging/build/size-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Show logs on failure
        if: failure()
        run: |
          for log in "$RUNNER_TEMP"/ls-smoke/logs/*.log; do
            [ -f "$log" ] || continue
            echo "== $log =="
            tail -n 120 "$log"
          done
          cat packaging/build/size-report.md 2>/dev/null || true

      - name: Upload DMG and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            Learning Space_*_aarch64.dmg
            packaging/build/size-report.json
            packaging/build/size-report.md
            ${{ runner.temp }}/ls-smoke/smoke-report.json
            ${{ runner.temp }}/ls-smoke/logs/*.log
          if-no-files-found: warn
