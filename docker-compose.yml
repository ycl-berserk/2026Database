services:
  db:
    image: pgvector/pgvector:pg16
    container_name: learning-space-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learning_space
      TZ: Asia/Shanghai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_space"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
