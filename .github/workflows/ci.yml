name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests and verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ls_app:ls_app_dev_pw@127.0.0.1:5432/learning_space
      T2S_DATABASE_URL: postgresql://t2s_reader:t2s_dev_pw@127.0.0.1:5432/learning_space
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgresql://ls_app:ls_app_dev_pw@127.0.0.1:5432/learning_space_test
      SESSION_SECRET: ci-only-session-secret-not-for-production
      APP_ENV: dev
      TEXT2SQL_MODE: mock
      EMBEDDING_MODE: "off"
      SUGGEST_MODE: "off"
      UV_FROZEN: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Check lockfile
        run: uv lock --check

      - name: Lint with Ruff
        run: uv run ruff check app scripts tests

      - name: Type check with pyright
        run: uv run pyright app

      - name: Preload pg_stat_statements
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U postgres -d postgres \
            -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements';"
          docker restart "${{ job.services.postgres.id }}"
          timeout 60 sh -c \
            'until docker exec "${{ job.services.postgres.id }}" pg_isready -U postgres; do sleep 2; done'

      - name: Initialize demo and test databases
        run: uv run python scripts/init_db.py --reset

      - name: Seed demo data
        run: uv run python scripts/seed_demo.py

      - name: Run unit and integration tests
        run: uv run pytest -q --junitxml=data/verification/junit.xml

      - name: Run end-to-end verification
        run: uv run python scripts/verify.py --json data/verification/report.json

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: |
            data/verification/report.json
            data/verification/junit.xml
          if-no-files-found: warn
